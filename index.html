<!--
  App de finanzas de Alberto · v5.0 (15/11/2026): Inicio simple (saldo por banco, aviso solo si no llegas en 30 días, una cifra mensual)
  - Los datos NO están aquí: están en datos.js, que genera generar_datos.py desde ../datos/.
  - Esta página solo lee window.DATOS, calcula y pinta. No modifica nada.
  - Regla de la app: ningún importe inventado. Lo que no se sabe sale como «sin importe» y no se resta.
  - Se usa en dos sitios: en Claude (artifact) y en el iPhone (publicar_movil.py). Un solo diseño, pensado para el
    móvil, que en pantallas anchas se centra y pasa a dos columnas. Ya no hay versión de PC con barra lateral.
  - v4.0: VARIAS CUENTAS. Cada banco tiene su color (verde o azul: lo dice config.cuentas[].color),
    su extracto y su previsión. Arriba se elige «Todas» o un banco y todo lo de la pantalla cambia con él.
    En «Todas» el total suma las cuentas con saldo conocido y un traspaso entre cuentas propias no cuenta como
    ingreso ni gasto. Si un banco se queda corto y el otro tiene margen, la app dice cuánto pasar y antes de qué día
    (es un cálculo, nunca entra en datos/). La app compara su previsión con la del generador y avisa si no coinciden.
  Mapa del código (de arriba abajo):
    UTILIDADES · MODELO (cuentas, categorías, meses, previsión, historia, hipoteca, posición líquida, patrimonio)
    · GRÁFICOS · PIEZAS · PESTAÑAS · HERRAMIENTAS · MARCO Y ARRANQUE
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Una columna pensada para el iPhone; desde 760 px, dos. Marco neutro (grafito y un toque de oro) para que el
   color lo pongan los bancos (verde y azul; cuál lleva cada cuenta lo dice config.json). Rojo, ámbar y verde oscuro son solo estados. */
:root{
  color-scheme: light;
  --papel:#f2f4f4; --hoja:#ffffff; --hoja-2:#f4f6f6; --tinta:#11181b; --tinta-2:#465157; --tinta-3:#667278;
  --raya:#dbe1e3; --raya-2:#e9eef0;
  --marca:#11181b; --marca-2:#2a363c; --marca-t2:rgba(255,255,255,.76); --marca-raya:rgba(255,255,255,.16);
  --sel:#11181b; --sel-t:#ffffff;
  --oro:#96702c; --oro-suave:rgba(168,128,58,.14); --oro-claro:#e9c98a;
  --verde:#1f8a5b; --verde-hondo:#176f49; --verde-noche:#0e4a31; --verde-claro:#5fd3a0; --verde-suave:rgba(31,138,91,.12);
  --azul:#2468d6; --azul-hondo:#1b55b3; --azul-noche:#11397a; --azul-claro:#8ab6ff; --azul-suave:rgba(36,104,214,.11);
  --gris-b:#6b777d;
  --bien:#157347; --bien-suave:rgba(21,115,71,.10); --critico:#c0392b; --critico-suave:rgba(192,57,43,.08);
  --aviso:#8f5a06; --aviso-suave:rgba(214,150,30,.16); --morado:#6a55c9; --morado-suave:rgba(106,85,201,.12);
  --sombra:0 1px 2px rgba(17,24,27,.05), 0 10px 28px rgba(17,24,27,.07);
  --radio:16px;
  --fuente:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --papel:#0c0f11; --hoja:#161a1d; --hoja-2:#1d2327; --tinta:#e8ecee; --tinta-2:#a8b2b7; --tinta-3:#869196;
    --raya:#2b3338; --raya-2:#21282c;
    --marca:#1b2125; --marca-2:#2a3338;
    --sel:#e8ecee; --sel-t:#11181b;
    --oro:#cfa560; --oro-suave:rgba(207,165,96,.15);
    --verde:#2fa772; --verde-suave:rgba(47,167,114,.17);
    --azul:#4a8fee; --azul-suave:rgba(74,143,238,.17);
    --gris-b:#8a969c;
    --bien:#3db27c; --bien-suave:rgba(61,178,124,.14); --critico:#ec6e5f; --critico-suave:rgba(236,110,95,.13);
    --aviso:#e6b04c; --aviso-suave:rgba(230,176,76,.14); --morado:#9d8cf0; --morado-suave:rgba(157,140,240,.15);
    --sombra:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --papel:#0c0f11; --hoja:#161a1d; --hoja-2:#1d2327; --tinta:#e8ecee; --tinta-2:#a8b2b7; --tinta-3:#869196;
  --raya:#2b3338; --raya-2:#21282c;
  --marca:#1b2125; --marca-2:#2a3338;
  --sel:#e8ecee; --sel-t:#11181b;
  --oro:#cfa560; --oro-suave:rgba(207,165,96,.15);
  --verde:#2fa772; --verde-suave:rgba(47,167,114,.17);
  --azul:#4a8fee; --azul-suave:rgba(74,143,238,.17);
  --gris-b:#8a969c;
  --bien:#3db27c; --bien-suave:rgba(61,178,124,.14); --critico:#ec6e5f; --critico-suave:rgba(236,110,95,.13);
  --aviso:#e6b04c; --aviso-suave:rgba(230,176,76,.14); --morado:#9d8cf0; --morado-suave:rgba(157,140,240,.15);
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--papel)}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--fuente);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--papel)}
:focus-visible{outline:2px solid var(--tinta);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
button,select,input{font:inherit;color:inherit}
.mal{color:var(--critico)} .bien{color:var(--bien)} .tenue{color:var(--tinta-3)} .ojo{color:var(--aviso)} .positivo{color:var(--bien)}
.ic{display:inline-grid;place-items:center;flex:none} .ic svg{width:100%;height:100%}

/* ---------- Bancos: el color es de la cuenta y siempre va con su nombre al lado ---------- */
.b-verde{--b:var(--verde);--b-hondo:var(--verde-hondo);--b-noche:var(--verde-noche);--b-claro:var(--verde-claro);--b-suave:var(--verde-suave);--b-t:#fff}
.b-azul{--b:var(--azul);--b-hondo:var(--azul-hondo);--b-noche:var(--azul-noche);--b-claro:var(--azul-claro);--b-suave:var(--azul-suave);--b-t:#fff}
.b-gris{--b:var(--gris-b);--b-hondo:#4d595f;--b-noche:#2a363c;--b-claro:#c3cdd2;--b-suave:var(--hoja-2);--b-t:#fff}
.b-neutro{--b:var(--tinta);--b-hondo:var(--marca-2);--b-noche:var(--marca);--b-claro:#fff;--b-suave:var(--hoja-2)}
.pb{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--b);flex:none}
.banco{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

/* ---------- Marco ---------- */
.contenido{max-width:980px;margin-inline:auto;padding-block:14px calc(128px + env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.cabecera{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.cabecera .marca{display:flex;align-items:center;gap:10px;min-width:0}
.cabecera .logo{width:32px;height:32px;border-radius:10px;background:var(--marca);display:grid;place-items:center;flex:none}
.cabecera .logo i{display:block;width:13px;height:13px;border-radius:4px;background:linear-gradient(135deg,var(--oro-claro),#b58d45)}
.cabecera h1{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cabecera .lado{display:flex;align-items:center;gap:8px}
.frescura{font-size:12px;font-weight:600;color:var(--tinta-2);background:var(--hoja);border:1px solid var(--raya-2);border-radius:20px;padding:5px 11px;white-space:nowrap}
.frescura.vieja{color:var(--aviso);font-weight:700}
.pend{position:relative;width:36px;height:36px;border-radius:50%;border:1px solid var(--raya);background:var(--hoja);color:var(--tinta-2);cursor:pointer;display:grid;place-items:center;padding:0}
.pend .ic{width:18px;height:18px}
.pend i{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--sel);color:var(--sel-t);font-size:10px;font-weight:800;font-style:normal;display:grid;place-items:center;padding:0 4px;border:2px solid var(--papel)}
.cuentas-sel{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.cuentas-sel::-webkit-scrollbar{display:none}
.cuentas-sel button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--raya);background:var(--hoja);color:var(--tinta-2);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.cuentas-sel button[aria-pressed="true"]{background:var(--b-hondo);border-color:var(--b-hondo);color:var(--b-t)}
.cuentas-sel button[aria-pressed="true"] .pb{background:#fff}
.cuentas-sel .b-neutro{--b-hondo:var(--sel);--b-t:var(--sel-t)}
.contraste-t{margin:22px 0 6px;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* ---------- Piezas ---------- */
.vista{display:flex;flex-direction:column;gap:12px}
.heroe{border-radius:22px;padding:20px;background:linear-gradient(135deg,var(--b-noche),var(--b-hondo));color:#fff;display:grid;gap:16px;min-width:0}
.heroe .n{font-size:13px;font-weight:600;color:var(--marca-t2)}
.heroe .grande{font-size:clamp(36px,9.5vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
.heroe .h-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px 14px;flex-wrap:wrap}
.heroe .h-sub{font-size:13px;color:var(--marca-t2);margin-top:6px}
.estado{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.14);white-space:nowrap}
.estado i{width:8px;height:8px;border-radius:50%;background:#8fe0bb}
.estado.malo i{background:#ff9a91} .estado.justo i{background:#f2c766} .estado.neutro i{background:rgba(255,255,255,.55)}
.h-cuentas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cta{display:grid;gap:1px;align-content:start;text-align:left;border:1px solid var(--marca-raya);background:rgba(255,255,255,.07);border-radius:16px;padding:12px 14px;color:#fff;cursor:pointer;min-width:0}
.cta:hover{background:rgba(255,255,255,.12)}
.cta .cta-n{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.cta .cta-n .pb{width:11px;height:11px;background:var(--b-claro)}
.cta .cta-v{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.cta .cta-d{font-size:12px;color:var(--marca-t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta .cta-e{font-size:12px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:6px}
.cta .cta-e i{width:7px;height:7px;border-radius:50%;background:#8fe0bb;flex:none}
.cta .cta-e.malo i{background:#ff9a91} .cta .cta-e.justo i{background:#f2c766} .cta .cta-e.neutro i{background:rgba(255,255,255,.55)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;gap:6px;align-items:baseline;font-size:12px;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.1);color:var(--marca-t2);white-space:nowrap}
.pill b{color:#fff;font-size:13px} .pill.rojo{background:rgba(255,120,110,.22)} .pill.rojo b{color:#ffd5cf}
.h-hor{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.tile.solo{display:block;width:100%}
.aviso-mes{background:var(--critico-suave,#fdecea);border:1px solid var(--critico,#c0392b);border-radius:var(--radio);padding:12px 14px;color:var(--critico,#c0392b)}
.aviso-mes p{margin:4px 0 0;color:inherit;font-size:14px}
.cifras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--hoja);border:1px solid var(--raya-2);border-radius:var(--radio);padding:13px 14px;min-width:0;text-align:left}
button.tile{cursor:pointer;font:inherit;color:inherit}
button.tile:hover{border-color:var(--tinta-3)}
.tile .n{font-size:12px;color:var(--tinta-2);font-weight:700}
.tile .v{font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1.2;margin:6px 0 2px}
.tile .d{font-size:12px;color:var(--tinta-3)}
.tile.alerta{border-color:var(--critico)}
.con-anillo{display:flex;gap:10px;align-items:center}
.anillo{width:46px;height:46px;flex:none}

.bloque{background:var(--hoja);border:1px solid var(--raya-2);border-radius:var(--radio);padding:14px 16px;min-width:0}
.bloque > h3{font-size:15px;font-weight:800;padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--raya-2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bloque > h3 .total{font-size:15px}
.dos,.mitades,.tres{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.pila{display:flex;flex-direction:column;gap:12px;min-width:0}
.sub{font-size:14px;color:var(--tinta-2);margin:6px 0 8px}
.nota{font-size:12px;color:var(--tinta-3);margin-top:8px}
.enlace{font-size:13px;font-weight:700;color:var(--tinta);cursor:pointer;background:none;border:0;padding:0;text-decoration:underline;text-decoration-color:var(--raya);text-underline-offset:3px}
.enlace:hover{text-decoration-color:var(--tinta)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--hoja-2);color:var(--tinta-2);white-space:nowrap}
.chip.rojo{background:var(--critico-suave);color:var(--critico)} .chip.oro{background:var(--oro-suave);color:var(--oro)}
.gran{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.vacio-b{padding:22px 4px;text-align:center;color:var(--tinta-2);font-size:14px}
.vacio-b b{display:block;color:var(--tinta);font-size:16px;margin-bottom:4px}

/* Por banco */
.reparto{display:flex;gap:2px;height:8px;margin:12px 0 4px}
.reparto i{display:block;min-width:4px;background:var(--b);border-radius:0}
.reparto i:first-child{border-radius:4px 0 0 4px} .reparto i:last-child{border-radius:0 4px 4px 0} .reparto i:only-child{border-radius:4px}
.bancos{list-style:none;margin:0;padding:0}
.bancos li{border-bottom:1px solid var(--raya-2)} .bancos li:last-child{border-bottom:0}
.bancos button{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,1fr));gap:4px 10px;align-items:center;width:100%;border:0;background:none;padding:11px 0;text-align:left;cursor:pointer}
.bancos .bn{display:flex;align-items:center;gap:8px;font-weight:800;min-width:0}
.bancos .bk{display:flex;flex-direction:column;align-items:flex-end;font-size:14px;white-space:nowrap}
.bancos .bk small{font-size:11px;color:var(--tinta-3);font-weight:600}
.bancos .bvacio{grid-column:2 / -1;font-size:13px;color:var(--tinta-3);text-align:right}

/* Gráficos */
.grafico{position:relative;background:var(--hoja);border:1px solid var(--raya-2);border-radius:var(--radio);padding:14px 8px 10px;margin:0;min-width:0}
.grafico .tit{font-size:15px;font-weight:800;padding:0 8px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grafico svg{display:block;width:100%;height:auto;overflow:visible}
.grafico svg text{font-family:var(--fuente);fill:var(--tinta-2);font-size:12px}
.leyenda{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--tinta-2);padding:0 8px 6px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px}
.leyenda i.linea{height:3px;border-radius:2px;width:18px}
.leyenda i.discontinua{height:0;border-top:3px dashed var(--tinta-2);background:none;border-radius:0;width:18px}
.tooltip{position:absolute;pointer-events:none;background:var(--sel);color:var(--sel-t);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.4;min-width:180px;max-width:290px;box-shadow:0 4px 18px rgba(0,0,0,.22);opacity:0;transition:opacity .12s;z-index:3}
.tooltip.visible{opacity:1}
.tooltip .fila{display:flex;justify-content:space-between;gap:10px}
.tooltip .fila span{display:inline-flex;align-items:center;gap:6px;min-width:0}
.tooltip .clave{display:inline-block;width:12px;height:3px;border-radius:2px;flex:none}
.fila-tit{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* Tablas y listas */
.envuelve{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:700;font-size:12px;color:var(--tinta-3);text-align:left;padding:8px 6px;border-bottom:1px solid var(--raya);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--raya-2);vertical-align:top}
.der{text-align:right;white-space:nowrap}
tr.total td{font-weight:800;border-top:2px solid var(--tinta);border-bottom:0}
.lista{list-style:none;margin:0;padding:0}
.lista li{padding:10px 0;border-bottom:1px solid var(--raya-2);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px}
.lista li:last-child{border-bottom:0}
.lista .nom{font-weight:700} .lista .val{text-align:right;font-weight:700;white-space:nowrap} .lista .det{grid-column:1 / -1;font-size:13px;color:var(--tinta-2)}

/* Filas estilo app (movimientos, cargos, bienes) */
.movs{list-style:none;margin:0;padding:0}
.mov{display:grid;grid-template-columns:36px 30px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--raya-2)}
.mov:last-child{border-bottom:0}
.movs .mov:not(:has(.fd)){grid-template-columns:30px minmax(0,1fr) auto}
.mov .fd,.sc-cab .fd{display:flex;flex-direction:column;align-items:center;line-height:1.05;font-size:11px;color:var(--tinta-3);text-transform:uppercase;font-weight:700}
.mov .fd b,.sc-cab .fd b{font-size:17px;color:var(--tinta);font-weight:800}
.mov .mi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--hoja-2);color:var(--tinta-2)}
.mov .mi svg{width:16px;height:16px}
.mov.ing .mi{background:var(--bien-suave);color:var(--bien)} .mov.sin .mi{background:var(--critico-suave);color:var(--critico)}
.mov.ven .mi{background:var(--aviso-suave);color:var(--aviso)} .mov.hip .mi{background:var(--morado-suave);color:var(--morado)}
.mov.oro .mi{background:var(--oro-suave);color:var(--oro)} .mov.cta-f .mi{background:var(--b-suave);color:var(--b)}
.mov.deu .mi{background:var(--critico-suave);color:var(--critico)}
.mov .mc{display:flex;flex-direction:column;min-width:0}
.mov .mn{font-weight:700;font-size:15px;line-height:1.25;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.mov .ms{font-size:12px;line-height:1.35;color:var(--tinta-3);overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.mov .ms .pb{width:7px;height:7px;margin-right:5px;vertical-align:1px}

    const L = await traer("llave.json");
    const base = await crypto.subtle.importKey("raw", enc.encode(normalizar(frase)), "PBKDF2", false, ["deriveKey"]);
    const k = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(L.salt), iterations: L.iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    return crypto.subtle.decrypt({name: "AES-GCM", iv: b64(L.iv)}, k, b64(L.ct));
  }
  async function descifrar(pkcs8){
    const priv = await crypto.subtle.importKey("pkcs8", pkcs8, {name: "ECDH", namedCurve: "P-256"}, false, ["deriveBits"]);
    const E = await traer("datos.enc.json");
    const epk = await crypto.subtle.importKey("raw", b64(E.epk), {name: "ECDH", namedCurve: "P-256"}, false, []);
    const bits = await crypto.subtle.deriveBits({name: "ECDH", public: epk}, priv, 256);
    const hk = await crypto.subtle.importKey("raw", bits, "HKDF", false, ["deriveKey"]);
    const k = await crypto.subtle.deriveKey({name: "HKDF", hash: "SHA-256", salt: b64(E.salt), info: enc.encode("finanzas-alberto")}, hk, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(E.iv)}, k, b64(E.ct))));
  }
  function arrancar(datos){
    window.DATOS = datos;
    document.getElementById("bloqueo").hidden = true;
    const s = document.createElement("script"); s.src = "app.js?v=23ead72177"; document.body.appendChild(s);
  }
  const msg = t => { document.getElementById("bloqueo-msg").textContent = t; };
  (async () => {
    let g = null; try { g = localStorage.getItem(GUARDADA); } catch(e) {}
    if (g){ try { arrancar(await descifrar(b64(g).buffer)); return; } catch(e) { try { localStorage.removeItem(GUARDADA); } catch(_) {} } }
    document.getElementById("bloqueo").classList.add("listo");
  })();
  document.getElementById("bloqueo-ver").addEventListener("change", ev => { document.getElementById("bloqueo-clave").type = ev.target.checked ? "text" : "password"; });
  document.getElementById("bloqueo-form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const btn = document.getElementById("bloqueo-btn"); btn.disabled = true; msg("Abriendo…");
    try {
      const pkcs8 = await abrirLlave(document.getElementById("bloqueo-clave").value.trim());
      const datos = await descifrar(pkcs8);
      if (document.getElementById("bloqueo-recordar").checked){ try { localStorage.setItem(GUARDADA, aB64(pkcs8)); } catch(e) {} }
      arrancar(datos);
    } catch(e) { msg(e.message === "red" ? "Sin conexión y sin datos guardados. Ábrela una vez con internet." : "Clave incorrecta. Prueba otra vez."); btn.disabled = false; }
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
