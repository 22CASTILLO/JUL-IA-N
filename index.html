<!--
  App de finanzas de Alberto · v3.0 (27/10/2026)
  - Los datos NO están aquí: están en datos.js, que genera generar_datos.py desde ../datos/.
  - Esta página solo lee window.DATOS, calcula y pinta. No modifica nada.
  - Regla de la app: ningún importe inventado. Lo que no se sabe sale como «sin importe» y no se resta.
  - v3: tres pestañas (Inicio = posición global, Pasado = lo que ya pasó, Futuro = previsión, calendario y recurrentes),
    Herramientas aparte (¿Puedo comprarlo?, Inversiones y Financiación, estas dos en desarrollo) y la posición
    líquida siempre a la vista (barra lateral en PC, barra inferior en el móvil). Los datos pendientes van en el
    botón discreto de la cabecera. La copia de la v2.1 está en index_v2.1.html.
  Mapa del código (sección <script>):
    UTILIDADES · MODELO (categorías, meses, previsión, cuadro de la hipoteca, posición líquida, patrimonio)
    · GRÁFICOS · PIEZAS · PESTAÑAS · HERRAMIENTAS · MARCO Y ARRANQUE
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Paleta: verde petróleo de banca privada, acento turquesa y un toque de oro. Claro y oscuro. */
:root{
  color-scheme: light;
  --papel:#f2f3ef; --hoja:#ffffff; --hoja-2:#f5f6f2; --tinta:#14201d; --tinta-2:#4a5753; --tinta-3:#7a8581;
  --raya:#dce0da; --raya-2:#e9ece6;
  --marca:#0e3430; --marca-2:#17544b; --marca-t:#ffffff; --marca-t2:rgba(255,255,255,.72); --marca-raya:rgba(255,255,255,.12);
  --acento:#13806e; --acento-suave:rgba(19,128,110,.10); --oro:#a8803a; --oro-suave:rgba(168,128,58,.13);
  --ingreso:#13806e; --gasto:#b8642b; --serie:#13806e; --serie-wash:rgba(19,128,110,.11); --serie-2:#a8803a;
  --critico:#c0392b; --critico-suave:rgba(192,57,43,.09); --aviso:#a26500; --aviso-suave:rgba(214,150,30,.14); --bien:#13806e; --bien-suave:rgba(19,128,110,.10); --foco:#13806e;
  --morado:#6a55c9;
  --sombra:0 1px 2px rgba(14,52,48,.05), 0 6px 20px rgba(14,52,48,.06);
  --radio:16px;
  --fuente:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --papel:#0d1312; --hoja:#151d1b; --hoja-2:#1b2422; --tinta:#e5ebe8; --tinta-2:#a9b5b1; --tinta-3:#7d8985;
    --raya:#28332f; --raya-2:#1f2926;
    --marca:#0f2b28; --marca-2:#153f39;
    --acento:#3db39b; --acento-suave:rgba(61,179,155,.14); --oro:#cfa560; --oro-suave:rgba(207,165,96,.15);
    --ingreso:#3db39b; --gasto:#d98b4e; --serie:#3db39b; --serie-wash:rgba(61,179,155,.15); --serie-2:#cfa560;
    --critico:#ec6e5f; --critico-suave:rgba(236,110,95,.13); --aviso:#e6b04c; --aviso-suave:rgba(230,176,76,.14); --bien:#3db39b; --bien-suave:rgba(61,179,155,.13); --foco:#5fd0b8;
    --morado:#9d8cf0; --sombra:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --papel:#0d1312; --hoja:#151d1b; --hoja-2:#1b2422; --tinta:#e5ebe8; --tinta-2:#a9b5b1; --tinta-3:#7d8985;
  --raya:#28332f; --raya-2:#1f2926;
  --marca:#0f2b28; --marca-2:#153f39;
  --acento:#3db39b; --acento-suave:rgba(61,179,155,.14); --oro:#cfa560; --oro-suave:rgba(207,165,96,.15);
  --ingreso:#3db39b; --gasto:#d98b4e; --serie:#3db39b; --serie-wash:rgba(61,179,155,.15); --serie-2:#cfa560;
  --critico:#ec6e5f; --critico-suave:rgba(236,110,95,.13); --aviso:#e6b04c; --aviso-suave:rgba(230,176,76,.14); --bien:#3db39b; --bien-suave:rgba(61,179,155,.13); --foco:#5fd0b8;
  --morado:#9d8cf0; --sombra:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--papel)}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--fuente);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--papel)}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
button,select,input{font:inherit;color:inherit}
.mal{color:var(--critico)} .bien{color:var(--bien)} .tenue{color:var(--tinta-3)} .ojo{color:var(--aviso)} .positivo{color:var(--bien)}
.ic{display:inline-grid;place-items:center;flex:none} .ic svg,.ico-svg svg{width:100%;height:100%}

/* ---------- Marco: barra lateral (PC) + contenido ---------- */
.marco{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.lateral{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,var(--marca) 0%,var(--marca-2) 100%);color:var(--marca-t);display:flex;flex-direction:column;gap:18px;padding:22px 16px 18px max(16px, env(safe-area-inset-left,0px))}
.marca{display:flex;align-items:center;gap:11px;padding:0 8px}
.marca .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-weight:800;color:#fff}
.marca .logo i{display:block;width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,#e5c27f,var(--oro))}
.marca b{display:block;font-size:16px;letter-spacing:-.01em} .marca span{display:block;font-size:12px;color:var(--marca-t2)}
.menu{display:flex;flex-direction:column;gap:2px}
.menu .grupo{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--marca-t2);padding:14px 10px 6px}
.menu button{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--marca-t2);padding:10px;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;text-align:left}
.menu button .ic{width:19px;height:19px}
.menu button:hover{background:rgba(255,255,255,.07);color:#fff}
.menu button[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff}
.menu .dev{margin-left:auto;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:10px;background:var(--oro-suave);color:#e9c98a;border:1px solid rgba(233,201,138,.3)}
.liq-lat{margin-top:auto;border-radius:16px;padding:16px;background:rgba(255,255,255,.07);border:1px solid var(--marca-raya)}
.liq-lat .n{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--marca-t2);display:flex;align-items:center;gap:7px}
.liq-lat .n .ic{width:15px;height:15px;color:#e9c98a}
.liq-lat .v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:4px 0 10px}
.liq-lat ul{list-style:none;margin:0;padding:0;font-size:13px}
.liq-lat li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--marca-raya);color:var(--marca-t2)}
.liq-lat li b{color:#fff;font-weight:700;white-space:nowrap}
.liq-lat .libre{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.25);font-size:13px;color:var(--marca-t2);display:flex;justify-content:space-between}
.liq-lat .libre b{color:#e9c98a}

.contenido{min-width:0;padding-block:22px 64px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.contenido > *{max-width:1180px;margin-inline:auto}
.cabecera{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.cabecera .marca-movil{display:none}
.cabecera h1{font-size:28px;font-weight:800}
.cabecera .lado{display:flex;align-items:center;gap:8px}
.frescura{font-size:13px;color:var(--tinta-2);background:var(--hoja);border:1px solid var(--raya-2);border-radius:20px;padding:5px 12px;white-space:nowrap}
.frescura.vieja{color:var(--aviso);font-weight:700}
.pend{position:relative;width:36px;height:36px;border-radius:50%;border:1px solid var(--raya);background:var(--hoja);color:var(--tinta-3);cursor:pointer;display:grid;place-items:center;padding:0}
.pend .ic{width:18px;height:18px}
.pend i{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;border-radius:9px;background:var(--oro);color:#fff;font-size:10px;font-weight:800;font-style:normal;display:grid;place-items:center;padding:0 4px}

/* ---------- Piezas ---------- */
.vista{display:flex;flex-direction:column;gap:16px}
.heroe{position:relative;overflow:hidden;border-radius:20px;padding:24px 26px;background:linear-gradient(130deg,var(--marca) 0%,var(--marca-2) 100%);color:var(--marca-t);box-shadow:var(--sombra)}
.heroe::after{content:"";position:absolute;right:-120px;top:-140px;width:360px;height:360px;border-radius:50%;border:1px solid rgba(233,201,138,.18);box-shadow:0 0 0 40px rgba(255,255,255,.02),0 0 0 80px rgba(255,255,255,.015)}
.heroe > *{position:relative;z-index:1}
.heroe .n{font-size:13px;font-weight:600;color:var(--marca-t2)}
.heroe .grande{font-size:clamp(34px,5.4vw,50px);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin-top:2px}
.heroe .fila-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:26px;align-items:end}
.estado{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:5px 11px;border-radius:20px;background:rgba(255,255,255,.12);margin-bottom:10px}
.estado i{width:8px;height:8px;border-radius:50%;background:#7fd8b5}
.heroe.malo .estado i{background:#ff8f86} .heroe.justo .estado i{background:#f2c766}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-flex;gap:6px;align-items:baseline;font-size:13px;padding:6px 11px;border-radius:20px;background:rgba(255,255,255,.1);color:var(--marca-t2);white-space:nowrap}
.pill b{color:#fff;font-size:14px} .pill.rojo{background:rgba(255,120,110,.2)} .pill.rojo b{color:#ffd5cf}
.compos{display:flex;flex-direction:column;gap:10px}
.compos .fila{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;color:var(--marca-t2)}
.compos .barra{display:flex;height:12px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.08)}
.compos .barra i{display:block;height:100%}
.compos .fila b{color:#fff;font-size:14px;text-align:right}
.compos .ley{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--marca-t2)}
.compos .ley span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--c)}

.cifras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--hoja);border-radius:var(--radio);box-shadow:var(--sombra);padding:15px 16px;min-width:0;position:relative;border:1px solid transparent}
button.tile{text-align:left;cursor:pointer;font:inherit;color:inherit;border:1px solid transparent}
button.tile:hover{border-color:var(--raya)}
.tile .n{font-size:13px;color:var(--tinta-2);font-weight:600;display:flex;align-items:center;gap:8px}
.tile .n .ic{width:26px;height:26px;border-radius:8px;background:var(--hoja-2);color:var(--tinta-2);padding:5px}
.tile .v{font-size:24px;font-weight:800;letter-spacing:-.015em;line-height:1.2;margin:8px 0 2px}
.tile .d{font-size:13px;color:var(--tinta-3)}
.tile.alerta{border-color:var(--critico)} .tile.alerta .n .ic{background:var(--critico-suave);color:var(--critico)}
.tile.ok .n .ic{background:var(--bien-suave);color:var(--bien)}
.con-anillo{display:flex;gap:12px;align-items:center}
.anillo{width:56px;height:56px;flex:none}

.bloque{background:var(--hoja);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px 18px;min-width:0}
.bloque > h3{font-size:16px;font-weight:800;padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--raya-2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bloque > h3 .total{font-size:15px}
.dos{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px}
.mitades{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pila{display:flex;flex-direction:column;gap:16px;min-width:0}
.sub{font-size:14px;color:var(--tinta-2);margin:6px 0 8px}
.nota{font-size:12px;color:var(--tinta-3);margin-top:8px}
.mt{margin-top:0}
.enlace{font-size:14px;font-weight:700;color:var(--acento);cursor:pointer;background:none;border:0;padding:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--hoja-2);color:var(--tinta-2);white-space:nowrap}
.chip.rojo{background:var(--critico-suave);color:var(--critico)} .chip.oro{background:var(--oro-suave);color:var(--oro)}
.gran{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:6px}

/* Gráficos */
.grafico{position:relative;background:var(--hoja);border-radius:var(--radio);box-shadow:var(--sombra);padding:14px 10px 10px;margin:0;min-width:0}
.grafico.limpio{background:none;box-shadow:none;padding:0}
.grafico .tit{font-size:16px;font-weight:800;padding:0 8px 6px}
.grafico svg{display:block;width:100%;height:auto;overflow:visible}
.grafico svg text{font-family:var(--fuente);fill:var(--tinta-2);font-size:12px}
.leyenda{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--tinta-2);padding:0 8px 6px}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.leyenda i.linea{height:3px;border-radius:2px;vertical-align:3px;width:18px}
.leyenda i.discontinua{height:0;border-top:3px dashed var(--serie);background:none!important;border-radius:0;width:18px;vertical-align:3px}
.tooltip{position:absolute;pointer-events:none;background:var(--tinta);color:var(--hoja);border-radius:9px;padding:8px 10px;font-size:13px;line-height:1.35;min-width:170px;max-width:290px;box-shadow:0 4px 18px rgba(0,0,0,.22);opacity:0;transition:opacity .12s;z-index:3}
.tooltip.visible{opacity:1}
.tooltip .fila{display:flex;justify-content:space-between;gap:10px}
.fila-tit{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* Tablas y listas */
.envuelve{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:700;font-size:12px;color:var(--tinta-3);text-align:left;padding:8px 6px;border-bottom:1px solid var(--raya);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--raya-2);vertical-align:top}
.der{text-align:right;white-space:nowrap}
tr.total td{font-weight:800;border-top:2px solid var(--tinta);border-bottom:0}
.lista{list-style:none;margin:0;padding:0}
.lista li{padding:10px 0;border-bottom:1px solid var(--raya-2);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px}
.lista li:last-child{border-bottom:0}
.lista .nom{font-weight:700} .lista .val{text-align:right;font-weight:700;white-space:nowrap} .lista .det{grid-column:1 / -1;font-size:13px;color:var(--tinta-2)}

/* Filas estilo app (movimientos, cargos, bienes) */
.movs{list-style:none;margin:0;padding:0}
.mov{display:grid;grid-template-columns:42px 34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--raya-2)}
.mov:last-child{border-bottom:0}
.movs .mov:not(:has(.fd)){grid-template-columns:34px minmax(0,1fr) auto}
.mov .fd{display:flex;flex-direction:column;align-items:center;line-height:1.05;font-size:11px;color:var(--tinta-3);text-transform:uppercase;font-weight:700}
.mov .fd b{font-size:18px;color:var(--tinta);font-weight:800}
.mov .mi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--hoja-2);color:var(--tinta-2)}
.mov .mi svg{width:17px;height:17px}
.mov.ing .mi{background:var(--bien-suave);color:var(--bien)} .mov.sin .mi{background:var(--critico-suave);color:var(--critico)}
.mov.ven .mi{background:var(--aviso-suave);color:var(--aviso)} .mov.hip .mi{background:rgba(106,85,201,.12);color:var(--morado)}
.mov.oro .mi{background:var(--oro-suave);color:var(--oro)}
.mov .mc{display:flex;flex-direction:column;min-width:0}
.mov .mn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .ms{font-size:12px;color:var(--tinta-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov.sin .ms{color:var(--critico)}
.mov .mv{display:flex;flex-direction:column;align-items:flex-end;font-size:15px;white-space:nowrap}
.mov .mv span{font-size:12px;color:var(--tinta-3)}
.mes-sep{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--tinta-3);padding:14px 0 4px;border-bottom:1px solid var(--raya)}
.dia-sep{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700;color:var(--tinta-3);padding:12px 0 2px;text-transform:capitalize}

.alertas{list-style:none;margin:0;padding:0}
.alertas li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:8px 0;font-size:14px;align-items:start;border-bottom:1px solid var(--raya-2)}
.alertas li:last-child{border-bottom:0}
.alertas .ico{font-weight:800;text-align:center;border-radius:50%;width:20px;height:20px;line-height:20px;font-size:12px}
.alertas .grave .ico{background:var(--critico);color:#fff} .alertas .aviso .ico{background:var(--aviso);color:#fff}
.alertas .info .ico{border:1.5px solid var(--tinta-3);color:var(--tinta-3);line-height:17px}

/* Certeza (forma + texto, nunca solo color) */
.cert{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--tinta-2)}
.cert::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tinta-2)}
.cert.ultimo_real::before{background:transparent;border:2px solid var(--tinta-2);width:6px;height:6px}
.cert.sin_importe{color:var(--critico)} .cert.sin_importe::before{content:"?";width:auto;height:auto;background:none;font-weight:800}
.cert.aviso::before{background:none;border:2px solid var(--tinta-3);border-radius:2px;width:6px;height:6px}
.cert.hipotesis{color:var(--morado)} .cert.hipotesis::before{background:none;border:2px dashed var(--morado);border-radius:2px;width:6px;height:6px}

/* Controles */
.controles{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.controles label{font-size:13px;color:var(--tinta-2);display:flex;gap:8px;align-items:center;font-weight:600}
.segmentos{display:inline-flex;border:1px solid var(--raya);border-radius:10px;overflow:hidden;background:var(--hoja);max-width:100%;overflow-x:auto}

<script>
"use strict";
// Desbloqueo: la clave abre la llave privada (llave.json) y con ella se descifran los datos (datos.enc.json)
(function(){
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const aB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const enc = new TextEncoder(), GUARDADA = "finanzas-llave";
  const traer = async f => { const r = await fetch(f, {cache: "no-cache"}); if (!r.ok) throw new Error("red"); return r.json(); };
  // Mayúsculas, espacios, guiones y tildes no cuentan: «mango hierro koala» = «Mango-Hierro-Koala»
  const normalizar = f => f.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
  async function abrirLlave(frase){
    const L = await traer("llave.json");
    const base = await crypto.subtle.importKey("raw", enc.encode(normalizar(frase)), "PBKDF2", false, ["deriveKey"]);
    const k = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(L.salt), iterations: L.iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    return crypto.subtle.decrypt({name: "AES-GCM", iv: b64(L.iv)}, k, b64(L.ct));
  }
  async function descifrar(pkcs8){
    const priv = await crypto.subtle.importKey("pkcs8", pkcs8, {name: "ECDH", namedCurve: "P-256"}, false, ["deriveBits"]);
    const E = await traer("datos.enc.json");
    const epk = await crypto.subtle.importKey("raw", b64(E.epk), {name: "ECDH", namedCurve: "P-256"}, false, []);
    const bits = await crypto.subtle.deriveBits({name: "ECDH", public: epk}, priv, 256);
    const hk = await crypto.subtle.importKey("raw", bits, "HKDF", false, ["deriveKey"]);
    const k = await crypto.subtle.deriveKey({name: "HKDF", hash: "SHA-256", salt: b64(E.salt), info: enc.encode("finanzas-alberto")}, hk, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(E.iv)}, k, b64(E.ct))));
  }
  function arrancar(datos){
    window.DATOS = datos;
    document.getElementById("bloqueo").hidden = true;
    const s = document.createElement("script"); s.src = "app.js?v=8bee279221"; document.body.appendChild(s);
  }
  const msg = t => { document.getElementById("bloqueo-msg").textContent = t; };
  (async () => {
    let g = null; try { g = localStorage.getItem(GUARDADA); } catch(e) {}
    if (g){ try { arrancar(await descifrar(b64(g).buffer)); return; } catch(e) { try { localStorage.removeItem(GUARDADA); } catch(_) {} } }
    document.getElementById("bloqueo").classList.add("listo");
  })();
  document.getElementById("bloqueo-ver").addEventListener("change", ev => { document.getElementById("bloqueo-clave").type = ev.target.checked ? "text" : "password"; });
  document.getElementById("bloqueo-form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const btn = document.getElementById("bloqueo-btn"); btn.disabled = true; msg("Abriendo…");
    try {
      const pkcs8 = await abrirLlave(document.getElementById("bloqueo-clave").value.trim());
      const datos = await descifrar(pkcs8);
      if (document.getElementById("bloqueo-recordar").checked){ try { localStorage.setItem(GUARDADA, aB64(pkcs8)); } catch(e) {} }
      arrancar(datos);
    } catch(e) { msg(e.message === "red" ? "Sin conexión y sin datos guardados. Ábrela una vez con internet." : "Clave incorrecta. Prueba otra vez."); btn.disabled = false; }
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
